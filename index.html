<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lingo — English Learning Adventures</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 14px;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            padding: 28px 22px;
            border: 2px solid #e2e8f0;
        }

        header {
            text-align: center;
            margin-bottom: 26px;
        }

        .logo-badge {
            display: inline-block;
            background: #fef3c7;
            color: #b45309;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #fde68a;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            color: #0f172a;
        }

        header p {
            margin: 6px 0 0;
            color: #64748b;
            font-size: 15px;
        }

        .step-title {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #64748b;
            margin-bottom: 10px;
            text-align: center;
        }

        /* 1. ADIM: SINIF BUTONLARI */
        .grades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        @media (max-width: 600px) {
            .grades-grid { grid-template-columns: 1fr; gap: 10px; }
        }

        .grade-btn {
            background: #f8fafc;
            border: 2.5px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .grade-btn:hover {
            transform: translateY(-2px);
            border-color: #94a3b8;
        }

        .grade-btn .emoji { font-size: 30px; }
        .grade-btn .title { font-size: 18px; font-weight: 800; color: #1e293b; }
        .grade-btn .sub { font-size: 12px; font-weight: 600; color: #64748b; }

        .grade-btn.active-2 { background: #eff6ff; border-color: #2563eb; box-shadow: 0 6px 16px rgba(37,99,235,0.16); }
        .grade-btn.active-2 .title { color: #1d4ed8; }

        .grade-btn.active-3 { background: #f0fdf4; border-color: #16a34a; box-shadow: 0 6px 16px rgba(22,163,74,0.16); }
        .grade-btn.active-3 .title { color: #15803d; }

        .grade-btn.active-4 { background: #fffbeb; border-color: #d97706; box-shadow: 0 6px 16px rgba(217,119,6,0.16); }
        .grade-btn.active-4 .title { color: #b45309; }

        /* BAŞLANGIÇ BOŞ DURUM */
        .empty-prompt {
            text-align: center;
            padding: 36px 16px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 18px;
            color: #64748b;
            font-size: 16px;
            font-weight: 600;
        }

        /* 2. ADIM: GAMES / LESSON NOTES SEKMELERİ */
        .main-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .tab-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            background: transparent;
            color: #475569;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* 3. ADIM: TEMA / ÜNİTE HAP BUTONLARI */
        .pills-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
        }

        .unit-pill {
            padding: 8px 16px;
            border-radius: 999px;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }

        .unit-pill:hover {
            border-color: #64748b;
            color: #0f172a;
        }

        .unit-pill.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(37,99,235,0.25);
        }

        /* İÇERİK KARTLARI */
        .unit-header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border-left: 5px solid #2563eb;
        }

        .unit-header-box h3 {
            margin: 0;
            font-size: 18px;
            color: #0f172a;
        }

        .unit-tag {
            font-size: 12px;
            font-weight: 800;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }

        .item-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            transition: 0.2s;
        }

        .item-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 6px 18px rgba(37,99,235,0.08);
        }

        .item-card h4 {
            margin: 0 0 6px;
            font-size: 17px;
            color: #1e293b;
        }

        .item-card p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
            line-height: 1.45;
        }

        .action-btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            background: #10b981;
            color: #ffffff;
            font-weight: 800;
            font-size: 15px;
            padding: 11px 16px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .action-btn:hover { background: #059669; }

        .action-btn.note-btn { background: #3b82f6; }
        .action-btn.note-btn:hover { background: #2563eb; }

        .coming-card {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 28px 18px;
            text-align: center;
            color: #64748b;
        }

        .gizli { display: none; }

        footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-badge">✨ Little Lingo</div>
        <h1>English Learning Adventures</h1>
        <p>Select your grade, pick a theme or unit, and start learning!</p>
    </header>

    <!-- 1. ADIM: SINIF SEÇİMİ -->
    <div class="step-title">Step 1 · Choose Your Grade</div>
    <div class="grades-grid">
        <button id="btnGrade2" class="grade-btn" onclick="selectGrade(2)">
            <span class="emoji">🎈</span>
            <span class="title">2nd Grade</span>
            <span class="sub">Themes 1 – 6</span>
        </button>
        <button id="btnGrade3" class="grade-btn" onclick="selectGrade(3)">
            <span class="emoji">🚀</span>
            <span class="title">3rd Grade</span>
            <span class="sub">Themes 1 – 6</span>
        </button>
        <button id="btnGrade4" class="grade-btn" onclick="selectGrade(4)">
            <span class="emoji">🌍</span>
            <span class="title">4th Grade</span>
            <span class="sub">Units 1 – 10</span>
        </button>
    </div>

    <!-- BAŞLANGIÇ MESAJI -->
    <div id="welcomeBox" class="empty-prompt">
        👆 Tap a grade above to view Games and Lesson Notes!
    </div>

    <!-- 2. VE 3. ADIM ALANI -->
    <div id="contentArea" class="gizli">
        <div class="main-tabs">
            <button id="tabGames" class="tab-btn active" onclick="selectTab('games')">🎮 Games</button>
            <button id="tabNotes" class="tab-btn" onclick="selectTab('notes')">📚 Lesson Notes</button>
        </div>

        <div id="pillsContainer" class="pills-wrapper"></div>
        <div id="dynamicContent"></div>
    </div>
</div>

<footer>
    © Little Lingo · Interactive English Games & Study Notes
</footer>

<script>
    const curriculumData = {
        2: {
            label: "Theme",
            defaultUnit: 1,
            units: [
                {
                    id: 1,
                    title: "School Life & Greetings",
                    games: [
                        {
                            name: "🎧 Game 1 · Listen & Order",
                            desc: "Listen to the sentence and put the words in the correct order!",
                            url: "2nd_grades/theme1/game1/2nd_grades_theme1_game1.html",
                            btnText: "▶ Play Game 1"
                        },
                        {
                            name: "🃏 Game 2 · Picture & Word Match",
                            desc: "Flip the cards, listen, and match pictures with words!",
                            url: "2nd_grades/theme1/game2/2nd_grades_theme1_game2.html",
                            btnText: "▶ Play Game 2"
                        }
                    ],
                    notes: []
                },
                { id: 2, title: "Classroom & Friends", games: [], notes: [] },
                { id: 3, title: "Numbers & Colors", games: [], notes: [] },
                { id: 4, title: "Body Parts", games: [], notes: [] },
                { id: 5, title: "Pets & Animals", games: [], notes: [] },
                { id: 6, title: "Fruits & Food", games: [], notes: [] }
            ]
        },
        3: {
            label: "Theme",
            defaultUnit: 1,
            units: [
                { id: 1, title: "Greeting & Meeting", games: [], notes: [] },
                { id: 2, title: "My Family", games: [], notes: [] },
                { id: 3, title: "People I Love", games: [], notes: [] },
                { id: 4, title: "Feelings", games: [], notes: [] },
                { id: 5, title: "Toys and Games", games: [], notes: [] },
                { id: 6, title: "My House", games: [], notes: [] }
            ]
        },
        4: {
            label: "Unit",
            defaultUnit: 2,
            units: [
                { id: 1, title: "Classroom Rules", games: [], notes: [] },
                {
                    id: 2,
                    title: "Nationality",
                    games: [
                        {
                            name: "🏳️ Game 1 · Countries & Flags",
                            desc: "Listen to the country name and pick the correct flag!",
                            url: "4th_grades/unit2/game1/4th_grades_unit2_game1.html",
                            btnText: "▶ Play Game 1"
                        }
                    ],
                    notes: []
                },
                { id: 3, title: "Cartoon Characters", games: [], notes: [] },
                { id: 4, title: "Free Time", games: [], notes: [] },
                { id: 5, title: "My Day", games: [], notes: [] },
                { id: 6, title: "Fun with Science", games: [], notes: [] },
                { id: 7, title: "Jobs", games: [], notes: [] },
                { id: 8, title: "My Clothes", games: [], notes: [] },
                { id: 9, title: "My Friends", games: [], notes: [] },
                { id: 10, title: "Food and Drinks", games: [], notes: [] }
            ]
        }
    };

    let currentGrade = null;
    let currentTab = "games";
    let currentUnitId = null;

    function selectGrade(grade) {
        currentGrade = grade;
        currentTab = "games";
        currentUnitId = curriculumData[grade].defaultUnit;

        document.getElementById("btnGrade2").className = "grade-btn" + (grade === 2 ? " active-2" : "");
        document.getElementById("btnGrade3").className = "grade-btn" + (grade === 3 ? " active-3" : "");
        document.getElementById("btnGrade4").className = "grade-btn" + (grade === 4 ? " active-4" : "");

        document.getElementById("welcomeBox").classList.add("gizli");
        document.getElementById("contentArea").classList.remove("gizli");

        updateTabUI();
        renderPills();
        renderContent();
    }

    function selectTab(tab) {
        currentTab = tab;
        updateTabUI();
        renderContent();
    }

    function updateTabUI() {
        document.getElementById("tabGames").className = "tab-btn" + (currentTab === "games" ? " active" : "");
        document.getElementById("tabNotes").className = "tab-btn" + (currentTab === "notes" ? " active" : "");
    }

    function selectUnit(unitId) {
        currentUnitId = unitId;
        renderPills();
        renderContent();
    }

    function renderPills() {
        const gradeObj = curriculumData[currentGrade];
        const container = document.getElementById("pillsContainer");
        container.innerHTML = "";

        gradeObj.units.forEach(u => {
            const btn = document.createElement("button");
            btn.className = "unit-pill" + (u.id === currentUnitId ? " active" : "");
            btn.innerText = `${gradeObj.label} ${u.id}`;
            btn.onclick = () => selectUnit(u.id);
            container.appendChild(btn);
        });
    }

    function renderContent() {
        const gradeObj = curriculumData[currentGrade];
        const unitObj = gradeObj.units.find(u => u.id === currentUnitId);
        const container = document.getElementById("dynamicContent");

        let html = `
            <div class="unit-header-box">
                <h3>${gradeObj.label} ${unitObj.id} · ${unitObj.title}</h3>
                <span class="unit-tag">${currentGrade === 2 ? '2nd Grade' : currentGrade === 3 ? '3rd Grade' : '4th Grade'}</span>
            </div>
        `;

        if (currentTab === "games") {
            if (unitObj.games.length > 0) {
                html += `<div class="cards-grid">`;
                unitObj.games.forEach(g => {
                    html += `
                        <div class="item-card">
                            <div>
                                <h4>${g.name}</h4>
                                <p>${g.desc}</p>
                            </div>
                            <a href="${g.url}" class="action-btn">${g.btnText}</a>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="coming-card">
                        <strong>🔒 Games for ${gradeObj.label} ${unitObj.id} are coming soon!</strong><br>
                        <span style="font-size:13px;">Check back soon for new interactive activities.</span>
                    </div>
                `;
            }
        } else {
            if (unitObj.notes.length > 0) {
                html += `<div class="cards-grid">`;
                unitObj.notes.forEach(n => {
                    html += `
                        <div class="item-card">
                            <div>
                                <h4>${n.name}</h4>
                                <p>${n.desc}</p>
                            </div>
                            <a href="${n.url}" class="action-btn note-btn">${n.btnText}</a>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="coming-card">
                        <strong>📚 Lesson Notes for ${gradeObj.label} ${unitObj.id} (${unitObj.title})</strong><br>
                        <span style="font-size:13px;">Vocabulary lists and study cards will be added here soon.</span>
                    </div>
                `;
            }
        }

        container.innerHTML = html;
    }
</script>

</body>
</html>
