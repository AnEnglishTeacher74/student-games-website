<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lingo — English Learning Adventures</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 40px;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        /* Header */
        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 28px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border: 3px solid #bae6fd;
            margin-bottom: 28px;
        }

        .logo-badge {
            display: inline-block;
            background: #fef08a;
            color: #854d0e;
            font-weight: 800;
            font-size: 13px;
            padding: 5px 14px;
            border-radius: 999px;
            border: 2px solid #facc15;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        header h1 {
            font-size: 2.1rem;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.05rem;
            color: #475569;
            font-weight: 500;
        }

        /* Step 1: Grade Selection */
        .section-title {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 14px;
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 26px;
        }

        @media (max-width: 680px) {
            .grades-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            header h1 {
                font-size: 1.65rem;
            }
        }

        .grade-btn {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .grade-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .grade-icon {
            font-size: 2.4rem;
            margin-bottom: 4px;
        }

        .grade-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
        }

        .grade-tagline {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
        }

        /* Grade specific colors */
        .grade-2 .grade-tagline { background: #dcfce7; color: #166534; }
        .grade-2.active { border-color: #22c55e; background: #f0fdf4; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2); }

        .grade-3 .grade-tagline { background: #e0e7ff; color: #3730a3; }
        .grade-3.active { border-color: #6366f1; background: #eef2ff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }

        .grade-4 .grade-tagline { background: #ffedd5; color: #9a3412; }
        .grade-4.active { border-color: #f97316; background: #fff7ed; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(249, 115, 22, 0.2); }

        /* Initial Placeholder Box */
        .welcome-placeholder {
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #94a3b8;
            border-radius: 22px;
            padding: 45px 20px;
            text-align: center;
            color: #475569;
            font-size: 1.15rem;
            font-weight: 600;
            animation: fadeIn 0.4s ease;
        }

        .welcome-placeholder span {
            display: block;
            font-size: 2.6rem;
            margin-bottom: 10px;
        }

        /* Content Panel (Hidden until grade selected) */
        .content-panel {
            display: none;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 3px solid #e2e8f0;
            animation: fadeIn 0.35s ease;
        }

        .content-panel.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Step 2: Mode Tabs (Games / Lesson Notes) */
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 16px;
            margin-bottom: 22px;
        }

        .mode-tab {
            border: none;
            background: transparent;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-tab:hover {
            color: #1e293b;
        }

        .mode-tab.active-games {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .mode-tab.active-notes {
            background: #0d9488;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }

        /* Step 3: Theme / Unit Pills */
        .pills-wrapper {
            margin-bottom: 22px;
        }

        .pills-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 10px;
            text-align: center;
        }

        .pills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .pill-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            color: #334155;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: #3b82f6;
            color: #1d4ed8;
            background: #eff6ff;
        }

        .pill-btn.active {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
        }

        /* Cards Grid */
        .cards-header {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
        }

        .cards-header h3 {
            font-size: 1.35rem;
            color: #0f172a;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .item-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border-color: #93c5fd;
        }

        .item-card h4 {
            font-size: 1.15rem;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .item-card p {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.45;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            transform: scale(1.02);
        }

        .note-btn {
            display: inline-block;
            text-align: center;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
            transition: all 0.2s ease;
        }

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 2px dashed #cbd5e1;
            color: #64748b;
            font-weight: 600;
            font-size: 1.05rem;
        }

        footer {
            margin-top: 36px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-badge">✨ INTERACTIVE ENGLISH PORTAL</div>
        <h1>🦉 Little Lingo — English Learning Adventures</h1>
        <p>Play, listen, and learn English with fun!</p>
    </header>

    <!-- STEP 1: CHOOSE GRADE -->
    <div class="section-title">👇 Step 1: Choose Your Grade</div>
    <div class="grades-grid">
        <button class="grade-btn grade-2" onclick="selectGrade('grade2', this)">
            <span class="grade-icon">🐣</span>
            <span class="grade-name">2nd Grade</span>
            <span class="grade-tagline">Curious Learners</span>
        </button>

        <button class="grade-btn grade-3" onclick="selectGrade('grade3', this)">
            <span class="grade-icon">🦊</span>
            <span class="grade-name">3rd Grade</span>
            <span class="grade-tagline">Clever Minds</span>
        </button>

        <button class="grade-btn grade-4" onclick="selectGrade('grade4', this)">
            <span class="grade-icon">🚀</span>
            <span class="grade-name">4th Grade</span>
            <span class="grade-tagline">Super Explorers</span>
        </button>
    </div>

    <!-- INITIAL PLACEHOLDER -->
    <div id="welcomeBox" class="welcome-placeholder">
        <span>🎯</span>
        Ready for an adventure? Pick your grade above to unlock games &amp; notes!
    </div>

    <!-- STEP 2 & 3: DYNAMIC CONTENT PANEL -->
    <div id="contentPanel" class="content-panel">
        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button id="tabGames" class="mode-tab active-games" onclick="selectMode('games')">🎮 Games</button>
            <button id="tabNotes" class="mode-tab" onclick="selectMode('notes')">📚 Lesson Notes</button>
        </div>

        <!-- Theme / Unit Pills -->
        <div class="pills-wrapper">
            <div id="pillsLabel" class="pills-label">Select a Theme:</div>
            <div id="pillsContainer" class="pills-container"></div>
        </div>

        <!-- Dynamic Cards Output -->
        <div id="cardsOutput"></div>
    </div>

    <footer>
        Little Lingo — English Learning Adventures &copy; 2026
    </footer>
</div>

<script>
    const curriculumData = {
         grade2: {
            labelType: "Theme",
            defaultUnit: "theme1",
            units: [
                {
                    id: "theme1",
                    name: "Theme 1 · School Life",
                    games: [
                        {
                            title: "🎧 Game 1 · Listen & Order",
                            desc: "Listen carefully to the sentence and put the words in the right order!",
                            link: "2nd_grades/theme1/game1/2nd_grades_theme1_game1.html"
                        },
                        {
                            title: "🃏 Game 2 · Picture & Word Memory",
                            desc: "Flip the cards, listen, and match school pictures with English words!",
                            link: "2nd_grades/theme1/game2/2nd_grades_theme1_game2.html"
                        },
                        {
                            title: "🔍 Game 3 · Word Search Puzzle",
                            desc: "Tap the first letter to find the hidden school words!",
                            link: "2nd_grades/theme1/game3/2nd_grades_theme1_game3.html"
                        }
                    ],
                            notes: []
                },
                { id: "theme2", name: "Theme 2", games: [], notes: [] },
                { id: "theme3", name: "Theme 3", games: [], notes: [] },
                { id: "theme4", name: "Theme 4", games: [], notes: [] },
                { id: "theme5", name: "Theme 5", games: [], notes: [] },
                { id: "theme6", name: "Theme 6", games: [], notes: [] }
            ]
        },
        grade3: {
            labelType: "Theme",
            defaultUnit: "theme1",
            units: [
                {
                    id: "theme1",
                    name: "Theme 1 · School Life & Numbers",
                    games: [
                        {
                            title: "🎈 Game 1 · Balloon Pop (Numbers & Greetings)",
                            desc: "Listen carefully and pop the right balloon before it floats away!",
                            link: "3rd_grades/theme1/game1/3rd_grades_theme1_game1.html"
                        }
                    ],
                    notes: []
                },
                { id: "theme2", name: "Theme 2", games: [], notes: [] },
                { id: "theme3", name: "Theme 3", games: [], notes: [] },
                { id: "theme4", name: "Theme 4", games: [], notes: [] },
                { id: "theme5", name: "Theme 5", games: [], notes: [] },
                { id: "theme6", name: "Theme 6", games: [], notes: [] }
            ]
        },
        grade4: {
            labelType: "Unit",
            defaultUnit: "unit2",
            units: [
                { id: "unit1", name: "Unit 1 · Classroom Rules", games: [], notes: [] },
                {
                    id: "unit2",
                    name: "Unit 2 · Nationality",
                    games: [
                        {
                            title: "🏳️ Game 1 · Countries & Flags",
                            desc: "Listen to the country name and pick the correct flag before time runs out!",
                            link: "4th_grades/unit2/game1/4th_grades_unit2_game1.html"
                        }
                    ],
                    notes: []
                },
                { id: "unit3", name: "Unit 3 · Cartoon Characters", games: [], notes: [] },
                { id: "unit4", name: "Unit 4 · Free Time", games: [], notes: [] },
                { id: "unit5", name: "Unit 5 · My Day", games: [], notes: [] },
                { id: "unit6", name: "Unit 6 · Fun with Science", games: [], notes: [] },
                { id: "unit7", name: "Unit 7 · Jobs", games: [], notes: [] },
                { id: "unit8", name: "Unit 8 · My Clothes", games: [], notes: [] },
                { id: "unit9", name: "Unit 9 · My Friends", games: [], notes: [] },
                { id: "unit10", name: "Unit 10 · Food and Drinks", games: [], notes: [] }
            ]
        }
    };

    let currentGrade = null;
    let currentMode = "games";
    let currentUnitId = null;

    function selectGrade(gradeKey, btnElement) {
        currentGrade = gradeKey;
        currentMode = "games";
        currentUnitId = curriculumData[gradeKey].defaultUnit;

        document.querySelectorAll(".grade-btn").forEach(btn => btn.classList.remove("active"));
        btnElement.classList.add("active");

        document.getElementById("welcomeBox").style.display = "none";
        document.getElementById("contentPanel").classList.add("visible");

        updateTabsUI();
        renderPills();
        renderCards();
    }

    function selectMode(mode) {
        currentMode = mode;
        updateTabsUI();
        renderCards();
    }

    function updateTabsUI() {
        const tabGames = document.getElementById("tabGames");
        const tabNotes = document.getElementById("tabNotes");

        tabGames.className = "mode-tab" + (currentMode === "games" ? " active-games" : "");
        tabNotes.className = "mode-tab" + (currentMode === "notes" ? " active-notes" : "");
    }

    function renderPills() {
        const gradeObj = curriculumData[currentGrade];
        const container = document.getElementById("pillsContainer");
        document.getElementById("pillsLabel").innerText = `Select a ${gradeObj.labelType}:`;
        container.innerHTML = "";

        gradeObj.units.forEach(unit => {
            const pill = document.createElement("button");
            pill.className = "pill-btn" + (unit.id === currentUnitId ? " active" : "");
            pill.innerText = unit.name.split(" · ")[0];
            pill.onclick = () => {
                currentUnitId = unit.id;
                renderPills();
                renderCards();
            };
            container.appendChild(pill);
        });
    }

    function renderCards() {
        const gradeObj = curriculumData[currentGrade];
        const unitObj = gradeObj.units.find(u => u.id === currentUnitId);
        const output = document.getElementById("cardsOutput");

        if (!unitObj) return;

        let html = `<div class="cards-header"><h3>${unitObj.name}</h3></div>`;

        if (currentMode === "games") {
            if (unitObj.games.length === 0) {
                html += `
                    <div class="empty-state">
                        🚀 New exciting games for <strong>${unitObj.name}</strong> are coming very soon!
                    </div>
                `;
            } else {
                html += `<div class="items-grid">`;
                unitObj.games.forEach(game => {
                    html += `
                        <div class="item-card">
                            <div>
                                <h4>${game.title}</h4>
                                <p>${game.desc}</p>
                            </div>
                            <a href="${game.link}" class="play-btn">▶ Play Now</a>
                        </div>
                    `;
                });
                html += `</div>`;
            }
        } else {
            if (unitObj.notes.length === 0) {
                html += `
                    <div class="empty-state">
                        📝 Study flashcards &amp; lesson notes for <strong>${unitObj.name}</strong> are being prepared!
                    </div>
                `;
            } else {
                html += `<div class="items-grid">`;
                unitObj.notes.forEach(note => {
                    html += `
                        <div class="item-card">
                            <div>
                                <h4>${note.title}</h4>
                                <p>${note.desc}</p>
                            </div>
                            <a href="${note.link}" class="note-btn" target="_blank">📖 Open Notes</a>
                        </div>
                    `;
                });
                html += `</div>`;
            }
        }

        output.innerHTML = html;
    }
</script>

</body>
</html>
