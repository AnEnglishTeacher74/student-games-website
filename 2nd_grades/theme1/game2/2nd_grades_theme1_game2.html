<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resim & Kelime Eşleştirme Oyunu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 12px; }
        
        .kart-kapsayici {
            background: white;
            width: 100%;
            max-width: 780px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { color: #1e293b; margin-top: 0; }
        
        .input-grup { margin-bottom: 15px; text-align: left; max-width: 450px; margin-left: auto; margin-right: auto; }
        .input-grup label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .input-grup input {
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px;
        }
        .input-grup input:focus { border-color: #3b82f6; outline: none; }

        .btn {
            padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px;
        }
        .btn-basla { background-color: #2563eb; color: white; width: 100%; max-width: 450px; margin-top: 10px; }
        .btn-basla:hover { background-color: #1d4ed8; }
        .btn-anasayfa { background-color: #64748b; color: white; width: 100%; max-width: 450px; margin-top: 8px; }
        .btn-anasayfa:hover { background-color: #475569; }

        .ust-bilgi {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
            color: #475569;
            margin-bottom: 18px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .sure-kutusu {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
        }
        .cikis-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 6px;
            background: #f1f5f9;
        }
        .cikis-link:hover { background: #e2e8f0; color: #1e293b; }

        .oyun-izgara {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        @media (max-width: 650px) {
            .oyun-izgara { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        }

        .hafiza-kart {
            aspect-ratio: 1 / 1.05;
            perspective: 1000px;
            cursor: pointer;
            user-select: none;
        }

        .kart-ic {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.45s;
            transform-style: preserve-3d;
        }

        .hafiza-kart.acik .kart-ic,
        .hafiza-kart.eslesti .kart-ic {
            transform: rotateY(180deg);
        }

        .kart-on, .kart-arka {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
        }

        .kart-on {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-size: 28px;
            font-weight: bold;
            border: 2px solid #1d4ed8;
        }
        .kart-on:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        .kart-arka {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            transform: rotateY(180deg);
            color: #1e293b;
        }

        .hafiza-kart.eslesti .kart-arka {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
        }

        .kart-resim {
            width: 78%;
            height: 78%;
            object-fit: contain;
        }

        .kart-emoji {
            font-size: 42px;
            line-height: 1;
        }

        .kart-kelime {
            font-size: 16px;
            font-weight: 700;
            word-break: break-word;
            line-height: 1.2;
        }

        @media (max-width: 500px) {
            .kart-kelime { font-size: 13px; }
            .kart-emoji { font-size: 32px; }
        }

        .yildiz-kutusu { font-size: 52px; margin: 15px 0; letter-spacing: 8px; animation: popIn 0.5s ease; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .kayit-bilgi { font-size: 13px; color: #15803d; background: #dcfce7; padding: 10px; border-radius: 8px; margin: 15px auto; max-width: 450px; border: 1px solid #86efac; }
        .gizli { display: none; }
    </style>
</head>
<body>

<form name="oynayanlar" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="oyun_adi" />
    <input type="text" name="ogrenci_adi" />
    <input type="text" name="sinifi" />
    <input type="text" name="puan" />
    <input type="text" name="yildiz" />
    <input type="text" name="tarih_saat" />
</form>

<div class="kart-kapsayici">
    <div id="girisEkrani">
        <h2>🃏 Resim ve Kelime Eşleştirme</h2>
        <p style="color: #64748b;">Kartları çevir, dinle ve resim ile kelimenin eşini bul!</p>
        <div class="input-grup">
            <label for="ogrenciAd">Adın ve Soyadın:</label>
            <input type="text" id="ogrenciAd" placeholder="Örn: Ali Demir" onkeydown="enterKontrol(event)">
        </div>
        <div class="input-grup">
            <label for="ogrenciSinif">Sınıfın:</label>
            <input type="text" id="ogrenciSinif" placeholder="Örn: 2-A" onkeydown="enterKontrol(event)">
        </div>
        <button class="btn btn-basla" onclick="oyunuBaslat()">Başla ▶</button>
        <br>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://student-games-website.netlify.app/'">🏠 Ana Sayfaya Dön</button>
    </div>

    <div id="oyunEkrani" class="gizli">
        <div class="ust-bilgi">
            <span id="oyuncuBilgi">Öğrenci: -</span>
            <span>Eşleşme: <strong id="eslesmeSayisi">0</strong> / 12</span>
            <span class="sure-kutusu">⏱️ <span id="sureGosterge">0 sn</span></span>
            <a href="https://student-games-website.netlify.app/" class="cikis-link">🏠 Ana Sayfa</a>
        </div>

        <div id="oyunAlani" class="oyun-izgara"></div>
    </div>

    <div id="sonucEkrani" class="gizli">
        <h2>🎉 Harika İş Çıkardın!</h2>
        <div id="yildizAlani" class="yildiz-kutusu"></div>
        <p id="sonucMetni" style="font-size: 18px; line-height: 1.6; color: #334155;"></p>
        <div id="kayitDurumu" class="kayit-bilgi">Sonucun öğretmenine gönderiliyor...</div>
        <button class="btn btn-basla" onclick="location.reload()">Tekrar Oyna ↻</button>
        <br>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://student-games-website.netlify.app/'">🏠 Ana Sayfaya Dön</button>
    </div>
</div>

<script>
    const OYUNUN_ADI = "Resim ve Kelime Eşleştirme (2. Sınıf)";

    const kelimeVerileri = [
        { kelime: "teacher", dosya: "teacher", ikon: "👩‍🏫" },
        { kelime: "headmaster", dosya: "headmaster", ikon: "👨‍💼" },
        { kelime: "pupil", dosya: "pupil", ikon: "🎒" },
        { kelime: "girl", dosya: "girl", ikon: "👧" },
        { kelime: "boy", dosya: "boy", ikon: "👦" },
        { kelime: "friend", dosya: "friend", ikon: "🤝" },
        { kelime: "playground", dosya: "playground", ikon: "🛝" },
        { kelime: "classroom", dosya: "classroom", ikon: "🏫" },
        { kelime: "lunch hall", dosya: "lunch_hall", ikon: "🍽️" },
        { kelime: "sports hall", dosya: "sports_hall", ikon: "🏀" },
        { kelime: "library", dosya: "library", ikon: "📚" },
        { kelime: "garden", dosya: "garden", ikon: "🌳" }
    ];

    let acikKartlar = [];
    let kilitli = false;
    let eslesenCift = 0;
    let hamleSayisi = 0;
    let gecenSaniye = 0;
    let zamanlayici = null;
    let ogrenciAdi = "";
    let ogrenciSinifi = "";
    let aktifSes = null;

    function enterKontrol(e) {
        if (e.key === "Enter") oyunuBaslat();
    }

    function diziyiKaristir(dizi) {
        const kopya = [...dizi];
        for (let i = kopya.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [kopya[i], kopya[j]] = [kopya[j], kopya[i]];
        }
        return kopya;
    }

    function sureFormatla(toplamSaniye) {
        if (toplamSaniye < 60) {
            return `${toplamSaniye} sn`;
        }
        const dakika = Math.floor(toplamSaniye / 60);
        const saniye = toplamSaniye % 60;
        return `${dakika} dk ${saniye < 10 ? '0' : ''}${saniye} sn`;
    }

    function oyunuBaslat() {
        ogrenciAdi = document.getElementById("ogrenciAd").value.trim();
        ogrenciSinifi = document.getElementById("ogrenciSinif").value.trim();

        if (!ogrenciAdi || !ogrenciSinifi) {
            alert("Lütfen adını ve sınıfını yaz!");
            return;
        }

        document.getElementById("girisEkrani").classList.add("gizli");
        document.getElementById("oyunEkrani").classList.remove("gizli");
        document.getElementById("oyuncuBilgi").innerText = `${ogrenciAdi} (${ogrenciSinifi})`;

        kartlariOlustur();
        sayaciBaslat();
    }

    function sayaciBaslat() {
        gecenSaniye = 0;
        document.getElementById("sureGosterge").innerText = "0 sn";
        zamanlayici = setInterval(() => {
            gecenSaniye++;
            document.getElementById("sureGosterge").innerText = sureFormatla(gecenSaniye);
        }, 1000);
    }

    function kartlariOlustur() {
        const oyunAlani = document.getElementById("oyunAlani");
        oyunAlani.innerHTML = "";

        let tumKartlar = [];
        kelimeVerileri.forEach(item => {
            tumKartlar.push({ tip: "resim", kelime: item.kelime, dosya: item.dosya, ikon: item.ikon });
            tumKartlar.push({ tip: "yazi", kelime: item.kelime, dosya: item.dosya, ikon: item.ikon });
        });

        tumKartlar = diziyiKaristir(tumKartlar);

        tumKartlar.forEach((veri) => {
            const kart = document.createElement("div");
            kart.className = "hafiza-kart";
            kart.dataset.kelime = veri.kelime;

            let arkaIcerik = "";
            if (veri.tip === "resim") {
   	    	arkaIcerik = `
            		<img src="resimler/${veri.dosya}.png" alt="${veri.kelime}" class="kart-resim"
             			onerror="if(!this.dataset.deneme){this.dataset.deneme='jpg';this.src='resimler/${veri.dosya}.jpg';}else if(this.dataset.deneme==='jpg'){this.dataset.deneme='jpeg';this.src='resimler/${veri.dosya}.jpeg';}else{this.style.display='none';this.nextElementSibling.style.display='block';}">
            		<span class="kart-emoji" style="display:none;">${veri.ikon}</span>
           	`;
            } else {
                arkaIcerik = `<span class="kart-kelime">${veri.kelime}</span>`;
            }

            kart.innerHTML = `
                <div class="kart-ic">
                    <div class="kart-on">?</div>
                    <div class="kart-arka">${arkaIcerik}</div>
                </div>
            `;

            kart.onclick = () => kartaTiklandi(kart, veri);
            oyunAlani.appendChild(kart);
        });
    }

    function kartaTiklandi(kart, veri) {
        if (kilitli) return;
        if (kart.classList.contains("acik") || kart.classList.contains("eslesti")) return;

        kart.classList.add("acik");
        kelimeyiOku(veri.kelime, veri.dosya);
        acikKartlar.push(kart);

        if (acikKartlar.length === 2) {
            hamleSayisi++;
            eslesmeKontrolEt();
        }
    }

    function eslesmeKontrolEt() {
        kilitli = true;
        const [kart1, kart2] = acikKartlar;

        if (kart1.dataset.kelime === kart2.dataset.kelime) {
            setTimeout(() => {
                kart1.classList.add("eslesti");
                kart2.classList.add("eslesti");
                neseliDingCal(true);

                eslesenCift++;
                document.getElementById("eslesmeSayisi").innerText = eslesenCift;
                acikKartlar = [];
                kilitli = false;

                if (eslesenCift === kelimeVerileri.length) {
                    oyunuBitir();
                }
            }, 450);
        } else {
            setTimeout(() => {
                neseliDingCal(false);
            }, 400);

            setTimeout(() => {
                kart1.classList.remove("acik");
                kart2.classList.remove("acik");
                acikKartlar = [];
                kilitli = false;
            }, 1150);
        }
    }

    function kelimeyiOku(kelime, dosyaAdi) {
        window.speechSynthesis.cancel();
        if (aktifSes) {
            aktifSes.pause();
            aktifSes.currentTime = 0;
        }

        aktifSes = new Audio(`sesler/${dosyaAdi}.mp3`);
        aktifSes.onerror = () => tarayiciSesiyleOku(kelime);
        aktifSes.play().catch(() => tarayiciSesiyleOku(kelime));
    }

    function tarayiciSesiyleOku(kelime) {
        const metin = new SpeechSynthesisUtterance(kelime);
        metin.lang = 'en-US';
        metin.rate = 0.85;
        window.speechSynthesis.speak(metin);
    }

    function neseliDingCal(dogruMu) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const simdi = ctx.currentTime;

            if (dogruMu) {
                const notalar = [659.25, 783.99, 1046.50];
                notalar.forEach((frekans, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frekans, simdi + i * 0.1);

                    gain.gain.setValueAtTime(0.001, simdi + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.35, simdi + i * 0.1 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, simdi + i * 0.1 + 0.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(simdi + i * 0.1);
                    osc.stop(simdi + i * 0.1 + 0.55);
                });
            } else {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, simdi);
                osc.frequency.linearRampToValueAtTime(150, simdi + 0.22);

                gain.gain.setValueAtTime(0.22, simdi);
                gain.gain.exponentialRampToValueAtTime(0.001, simdi + 0.25);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(simdi);
                osc.stop(simdi + 0.25);
            }
        } catch (e) {}
    }

    async function oyunuBitir() {
        clearInterval(zamanlayici);
        document.getElementById("oyunEkrani").classList.add("gizli");
        document.getElementById("sonucEkrani").classList.remove("gizli");

        const bitisSuresiMetni = sureFormatla(gecenSaniye);

        const fazlaHamle = Math.max(0, hamleSayisi - 12);
        const puan = Math.max(40, 100 - (fazlaHamle * 3));

        let yildizSayisi = 1;
        let yildizMesaji = "Güzel çaba! Kartların yerini aklında tutarak daha hızlı bitirebilirsin.";
        if (puan >= 80) {
            yildizSayisi = 3;
            yildizMesaji = "Mükemmel hafıza! Tam bir yıldız öğrencisin!";
        } else if (puan >= 60) {
            yildizSayisi = 2;
            yildizMesaji = "Çok iyi iş çıkardın!";
        }

        document.getElementById("yildizAlani").innerText = "⭐".repeat(yildizSayisi) + "☆".repeat(3 - yildizSayisi);
        document.getElementById("sonucMetni").innerHTML = `
            <strong>${ogrenciAdi}</strong> (${ogrenciSinifi})<br>
            ${yildizMesaji}<br>
            Süre: <strong>${bitisSuresiMetni}</strong> | Puan: <strong>${puan} / 100</strong>
        `;

        await netlifyKaydet(puan, bitisSuresiMetni, yildizSayisi);
    }

    async function netlifyKaydet(puan, sureMetni, yildizSayisi) {
        const simdi = new Date();
        const tarihSaat = simdi.toLocaleDateString('tr-TR') + " " + 
                          simdi.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        const durumKutusu = document.getElementById("kayitDurumu");

        const formData = new URLSearchParams();
        formData.append("form-name", "oynayanlar");
        formData.append("oyun_adi", OYUNUN_ADI);
        formData.append("ogrenci_adi", ogrenciAdi);
        formData.append("sinifi", ogrenciSinifi);
        formData.append("puan", `${puan}/100 (${sureMetni})`);
        formData.append("yildiz", `${yildizSayisi} Yıldız`);
        formData.append("tarih_saat", tarihSaat);

        try {
            const yanit = await fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            });

            if (yanit.ok) {
                durumKutusu.innerHTML = `✅ Tebrikler! Sonucun başarıyla kaydedildi.`;
            } else {
                throw new Error("Sunucu yanıt vermedi");
            }
        } catch (err) {
            durumKutusu.style.background = "#fef3c7";
            durumKutusu.style.color = "#92400e";
            durumKutusu.style.borderColor = "#fcd34d";
            durumKutusu.innerHTML = `ℹ️ Oyun tamamlandı (Çevrimdışı mod).`;
        }
    }
</script>

</body>
</html>
