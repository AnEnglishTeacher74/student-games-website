<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Life Sınıf Eşyaları 2. sınıf</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }

        .kart {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { color: #1e293b; margin-top: 0; }

        .input-grup { margin-bottom: 15px; text-align: left; }
        .input-grup label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .input-grup input {
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px;
        }
        .input-grup input:focus { border-color: #3b82f6; outline: none; }

        .btn {
            padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; touch-action: manipulation;
        }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-basla { background-color: #2563eb; color: white; width: 100%; margin-top: 10px; }
        .btn-basla:hover:not(:disabled) { background-color: #1d4ed8; }
        .btn-anasayfa { background-color: #64748b; color: white; width: 100%; margin-top: 8px; }
        .btn-anasayfa:hover { background-color: #475569; }
        .btn-ses { background-color: #f59e0b; color: white; font-size: 16px; padding: 12px 18px; }
        .btn-ses:hover:not(:disabled) { background-color: #d97706; }
        .btn-sonraki { background-color: #6366f1; color: white; display: none; width: 100%; margin-top: 12px; }
        .btn-sonraki:hover { background-color: #4f46e5; }

        .ust-bilgi { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: #64748b; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .sure-rozet { background: #e0f2fe; color: #0369a1; font-weight: 700; padding: 3px 9px; border-radius: 999px; font-size: 13px; }
        .cikis-link { color: #64748b; text-decoration: none; font-weight: 600; font-size: 13px; padding: 4px 8px; border-radius: 6px; background: #f1f5f9; }

        .soru-baslik-kutusu {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            color: #1e3a8a;
            font-size: 22px;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 12px;
            margin: 0 auto 10px auto;
        }

        .aksiyon-satiri { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }

        .sahne-kapsayici {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 210px;
            margin: 10px auto 14px auto;
            border-radius: 14px;
            overflow: hidden;
            border: 3px solid #cbd5e1;
            background-color: #f8fafc;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }

        .esya-resmi, .esya-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 10px;
        }

        .parca-izgara {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            pointer-events: none;
        }

        .parca-kapak {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .parca-kapak.acik {
            opacity: 0;
            transform: scale(0.85);
        }

        .ipucu-satiri {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .secenekler-alani {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 14px 0;
        }

        @media (max-width: 480px) {
            .secenekler-alani { grid-template-columns: 1fr; }
            .sahne-kapsayici { height: 190px; }
            .soru-baslik-kutusu { font-size: 20px; }
        }

        .secenek-btn {
            background-color: #ffffff;
            border: 2px solid #94a3b8;
            color: #1e293b;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            touch-action: manipulation;
        }
        .secenek-btn:hover:not(:disabled) {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: translateY(-1px);
        }
        .secenek-btn:disabled { cursor: default; }
        .dogru-secenek { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .yanlis-secenek { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }

        .yildiz-kutusu { font-size: 52px; margin: 15px 0; letter-spacing: 8px; animation: popIn 0.5s ease; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .kayit-bilgi { font-size: 13px; color: #15803d; background: #dcfce7; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #86efac; }
        .mesaj { font-weight: bold; font-size: 16px; min-height: 24px; margin: 10px 0; }
        .gizli { display: none; }
    </style>
</head>
<body>

<div class="kart">
    <div id="girisEkrani">
        <h2>🏫 Classroom Life Sınıf Eşyaları 2. sınıf</h2>
        <p style="color: #64748b;">Başlamadan önce bilgilerini gir.</p>
        <div class="input-grup">
            <label for="ogrenciAd">Adın ve Soyadın:</label>
            <input type="text" id="ogrenciAd" placeholder="Örn: Ali Demir" onkeydown="enterKontrol(event)">
        </div>
        <div class="input-grup">
            <label for="ogrenciSinif">Sınıfın:</label>
            <input type="text" id="ogrenciSinif" placeholder="Örn: 2-A" onkeydown="enterKontrol(event)">
        </div>
        <button id="baslaBtn" class="btn btn-basla" onclick="oyunuBaslat()">Başla ▶</button>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://anenglishteacher74.github.io/student-games-website/'">🏠 Ana Sayfaya Dön</button>
    </div>

    <div id="oyunEkrani" class="gizli">
        <div class="ust-bilgi">
            <span id="oyuncuBilgi">Öğrenci: -</span>
            <span>Soru: <strong id="soruNo">1</strong> / <strong id="toplamSoru">0</strong></span>
            <span>Puan: <strong id="puan">0</strong></span>
            <span id="sureGosterge" class="sure-rozet">0 sn</span>
            <a href="https://anenglishteacher74.github.io/student-games-website/" class="cikis-link">🏠 Ana Sayfa</a>
        </div>

        <div id="whatIsThisBaslik" class="soru-baslik-kutusu">❓ What is this?</div>

        <div class="aksiyon-satiri">
            <button id="sesBtn" class="btn btn-ses" onclick="kelimeyiDinle()" title="Dinle">🔊 Dinle</button>
        </div>

        <div id="ipucuAlani" class="ipucu-satiri">Parçalar: 0 / 16 açıldı</div>

        <div class="sahne-kapsayici">
            <img id="esyaResim" class="esya-resmi gizli" alt="Classroom item">
            <div id="esyaSvgKutu" class="esya-svg"></div>
            <div id="parcaIzgara" class="parca-izgara"></div>
        </div>

        <div id="seceneklerAlani" class="secenekler-alani"></div>

        <div id="mesajAlani" class="mesaj"></div>

        <button id="sonrakiBtn" class="btn btn-sonraki" onclick="sonrakiSoru()">Sonraki Soru ➔</button>
    </div>

    <div id="sonucEkrani" class="gizli">
        <h2>🎉 Tebrikler!</h2>
        <div id="yildizAlani" class="yildiz-kutusu"></div>
        <p id="sonucMetni" style="font-size: 18px; line-height: 1.6; color: #334155;"></p>
        <div id="kayitDurumu" class="kayit-bilgi">Sonucun öğretmenine gönderiliyor...</div>
        <button class="btn btn-basla" onclick="location.reload()">Tekrar Oyna ↻</button>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://anenglishteacher74.github.io/student-games-website/'">🏠 Ana Sayfaya Dön</button>
    </div>
</div>

<script>
    const OYUNUN_ADI = "Classroom Life Sınıf Eşyaları 2. sınıf";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzH1gudYaYuoip_UYOTXQJVUwyXjhoOMm5SlYlvxyzmLz7xg3bp1A3PkX9nNJLlSk4/exec";

    const VARSAYILAN_KELIMELER = [
        "pencil", "book", "notebook", "pencil case", "rubber", "sharpener",
        "bag", "door", "window", "table", "desk", "computer",
        "board", "smart board", "scissors", "chalk", "glue"
    ];

    const TOPLAM_PARCA = 16;
    const PARCA_SURESI_MS = 1000;

    let kelimeListesi = [...VARSAYILAN_KELIMELER];
    let mevcutIndex = 0;
    let puan = 0;
    let denemeSayisi = 0;
    let acikParcaSayisi = 0;
    let soruTamamlandi = false;
    let ogrenciAdi = "";
    let ogrenciSinifi = "";
    let aktifSes = null;
    let sesBaglami = null;
    let hazirSesler = [];
    let parcaZamanlayici = null;
    let kalanKapaliParcalar = [];
    let gecenSaniye = 0;
    let sureZamanlayici = null;

    function parcaIzgarasiniOlustur() {
        const izgara = document.getElementById("parcaIzgara");
        izgara.innerHTML = "";
        for (let i = 0; i < TOPLAM_PARCA; i++) {
            const kapak = document.createElement("div");
            kapak.className = "parca-kapak";
            kapak.id = "parca-" + i;
            kapak.innerText = "?";
            izgara.appendChild(kapak);
        }
    }

    parcaIzgarasiniOlustur();

    function sureyiBicimlendir(toplamSn) {
        if (toplamSn < 60) {
            return `${toplamSn} sn`;
        }
        const dk = Math.floor(toplamSn / 60);
        const sn = toplamSn % 60;
        const snYazi = String(sn).padStart(2, "0");
        return `${dk} dk ${snYazi} sn`;
    }

    function sureSayaciniGuncelle() {
        const el = document.getElementById("sureGosterge");
        if (el) {
            el.innerText = sureyiBicimlendir(gecenSaniye);
        }
    }

    function sureSayaciniBaslat() {
        sureSayaciniDurdur();
        sureSayaciniGuncelle();
        sureZamanlayici = setInterval(() => {
            gecenSaniye++;
            sureSayaciniGuncelle();
        }, 1000);
    }

    function sureSayaciniDurdur() {
        if (sureZamanlayici) {
            clearInterval(sureZamanlayici);
            sureZamanlayici = null;
        }
    }

    function sesBaglaminiHazirla() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!sesBaglami) {
            sesBaglami = new AudioCtx();
        }
        if (sesBaglami.state === "suspended") {
            sesBaglami.resume().catch(() => {});
        }
        return sesBaglami;
    }

    function tarayiciSesleriniYukle() {
        if (!("speechSynthesis" in window)) return;
        hazirSesler = window.speechSynthesis.getVoices() || [];
    }

    if ("speechSynthesis" in window) {
        tarayiciSesleriniYukle();
        window.speechSynthesis.onvoiceschanged = tarayiciSesleriniYukle;
    }

    async function kelimeleriYukle() {
        const baslaBtn = document.getElementById("baslaBtn");
        try {
            const yanit = await fetch("sentences.txt", { cache: "no-store" });
            if (!yanit.ok) throw new Error("Dosya bulunamadı");
            const metin = await yanit.text();
            const satirlar = metin
                .split(/\r?\n|,/)
                .map(s => s.replace(/^\d+[\-\.\)]\s*/, "").trim().toLowerCase())
                .filter(s => s.length > 0);
            if (satirlar.length > 0) {
                kelimeListesi = satirlar;
            }
        } catch (hata) {
            kelimeListesi = [...VARSAYILAN_KELIMELER];
        } finally {
            if (baslaBtn) {
                baslaBtn.disabled = false;
                baslaBtn.innerText = "Başla ▶";
            }
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", kelimeleriYukle);
    } else {
        kelimeleriYukle();
    }

    function enterKontrol(e) { if (e.key === "Enter") oyunuBaslat(); }

    function diziyiKaristir(dizi) {
        const kopya = [...dizi];
        for (let i = kopya.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [kopya[i], kopya[j]] = [kopya[j], kopya[i]];
        }
        return kopya;
    }

    function sesAdaylariniSiraylaCal(adayYollar, yedekMetin) {
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
        }
        if (aktifSes) {
            aktifSes.pause();
            aktifSes.currentTime = 0;
        }

        let yedekCalindi = false;
        const yedekOku = () => {
            if (yedekCalindi || !yedekMetin) return;
            yedekCalindi = true;
            tarayiciSesiyleOku(yedekMetin);
        };

        let idx = 0;
        function deneSonraki() {
            if (idx >= adayYollar.length) {
                yedekOku();
                return;
            }
            const yol = adayYollar[idx++];
            const sesDosyasi = new Audio(yol);
            sesDosyasi.playsInline = true;
            aktifSes = sesDosyasi;

            sesDosyasi.onerror = deneSonraki;
            const oynatPromise = sesDosyasi.play();
            if (oynatPromise && typeof oynatPromise.catch === "function") {
                oynatPromise.catch(deneSonraki);
            }
        }

        deneSonraki();
    }

    function whatIsThisSesiniCal() {
        sesBaglaminiHazirla();
        const adaylar = [
            "sesler/what%20is%20this.mp3",
            "sesler/what is this.mp3",
            "sesler/what_is_this.mp3",
            "sesler/what-is-this.mp3",
            "sesler/whatisthis.mp3"
        ];
        sesAdaylariniSiraylaCal(adaylar, "What is this?");
    }

    function oyunuBaslat() {
        ogrenciAdi = document.getElementById("ogrenciAd").value.trim();
        ogrenciSinifi = document.getElementById("ogrenciSinif").value.trim();
        if (!ogrenciAdi || !ogrenciSinifi) { alert("Lütfen adını ve sınıfını yaz!"); return; }

        if (!Array.isArray(kelimeListesi) || kelimeListesi.length === 0) {
            kelimeListesi = [...VARSAYILAN_KELIMELER];
        }

        sesBaglaminiHazirla();
        tarayiciSesleriniYukle();

        kelimeListesi = diziyiKaristir(kelimeListesi);
        mevcutIndex = 0;
        puan = 0;
        gecenSaniye = 0;
        document.getElementById("puan").innerText = puan;

        document.getElementById("girisEkrani").classList.add("gizli");
        document.getElementById("oyunEkrani").classList.remove("gizli");
        document.getElementById("oyuncuBilgi").innerText = `${ogrenciAdi} (${ogrenciSinifi})`;
        document.getElementById("toplamSoru").innerText = kelimeListesi.length;

        sureSayaciniBaslat();
        soruyuHazirla(true);
    }

    function dosyaVaryasyonlariniOlustur(kelime) {
        const temiz = kelime.trim().toLowerCase();
        const altCizgi = temiz.replace(/\s+/g, "_");
        const tire = temiz.replace(/\s+/g, "-");
        const birlesik = temiz.replace(/\s+/g, "");
        const tabanlar = Array.from(new Set([temiz, altCizgi, tire, birlesik]));
        const uzantilar = ["jfif", "png", "jpg", "jpeg", "webp"];
        const adaylar = [];

        tabanlar.forEach(t => {
            uzantilar.forEach(uz => {
                adaylar.push(`resimler/${t}.${uz}`);
            });
        });
        return adaylar;
    }

    function resmiYukleVeyaSvgCiz(kelime) {
        const imgEl = document.getElementById("esyaResim");
        const svgKutu = document.getElementById("esyaSvgKutu");
        const adaylar = dosyaVaryasyonlariniOlustur(kelime);

        imgEl.classList.add("gizli");
        svgKutu.classList.remove("gizli");
        svgKutu.innerHTML = esyaSvgUret(kelime);

        let idx = 0;
        function deneSonraki() {
            if (idx >= adaylar.length) {
                imgEl.classList.add("gizli");
                svgKutu.classList.remove("gizli");
                return;
            }
            const yol = adaylar[idx++];
            imgEl.onload = function() {
                svgKutu.classList.add("gizli");
                imgEl.classList.remove("gizli");
            };
            imgEl.onerror = function() {
                deneSonraki();
            };
            imgEl.src = yol;
        }
        deneSonraki();
    }

    function esyaSvgUret(kelime) {
        const k = kelime.toLowerCase();
        const cizimler = {
            "pencil": `<svg viewBox="0 0 200 140"><polygon points="25,70 55,52 55,88" fill="#fde68a" stroke="#92400e" stroke-width="3"/><polygon points="25,70 37,63 37,77" fill="#1e293b"/><rect x="55" y="52" width="105" height="36" fill="#facc15" stroke="#92400e" stroke-width="3"/><rect x="160" y="52" width="14" height="36" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><rect x="174" y="52" width="12" height="36" rx="4" fill="#f87171" stroke="#991b1b" stroke-width="3"/></svg>`,
            "book": `<svg viewBox="0 0 200 140"><rect x="35" y="25" width="65" height="90" rx="6" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/><rect x="100" y="25" width="65" height="90" rx="6" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/><line x1="100" y1="25" x2="100" y2="115" stroke="#0369a1" stroke-width="3"/><line x1="50" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="3"/><line x1="115" y1="50" x2="150" y2="50" stroke="#0284c7" stroke-width="3"/></svg>`,
            "notebook": `<svg viewBox="0 0 200 140"><rect x="52" y="22" width="104" height="96" rx="6" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><line x1="75" y1="22" x2="75" y2="118" stroke="#f87171" stroke-width="2"/><line x1="88" y1="48" x2="140" y2="48" stroke="#059669" stroke-width="3"/><line x1="88" y1="68" x2="140" y2="68" stroke="#059669" stroke-width="3"/><line x1="88" y1="88" x2="125" y2="88" stroke="#059669" stroke-width="3"/><circle cx="52" cy="36" r="4" fill="#475569"/><circle cx="52" cy="58" r="4" fill="#475569"/><circle cx="52" cy="80" r="4" fill="#475569"/><circle cx="52" cy="102" r="4" fill="#475569"/></svg>`,
            "pencil case": `<svg viewBox="0 0 200 140"><rect x="32" y="42" width="136" height="58" rx="14" fill="#c084fc" stroke="#6b21a8" stroke-width="3"/><line x1="36" y1="64" x2="164" y2="64" stroke="#fef08a" stroke-width="4" stroke-dasharray="6,4"/><rect x="142" y="56" width="12" height="16" rx="2" fill="#facc15" stroke="#6b21a8" stroke-width="2"/></svg>`,
            "rubber": `<svg viewBox="0 0 200 140"><polygon points="45,85 115,40 158,68 88,113" fill="#f9a8d4" stroke="#9d174d" stroke-width="3"/><polygon points="92,55 115,40 158,68 135,83" fill="#60a5fa" stroke="#1e40af" stroke-width="3"/></svg>`,
            "sharpener": `<svg viewBox="0 0 200 140"><rect x="55" y="38" width="90" height="64" rx="10" fill="#fb923c" stroke="#9a3412" stroke-width="3"/><ellipse cx="100" cy="70" rx="18" ry="18" fill="#334155"/><polygon points="94,70 108,62 108,78" fill="#cbd5e1"/></svg>`,
            "bag": `<svg viewBox="0 0 200 140"><path d="M75,40 Q100,15 125,40" fill="none" stroke="#b91c1c" stroke-width="5"/><rect x="52" y="40" width="96" height="76" rx="16" fill="#ef4444" stroke="#991b1b" stroke-width="3"/><rect x="70" y="68" width="60" height="32" rx="6" fill="#f87171" stroke="#991b1b" stroke-width="2.5"/></svg>`,
            "door": `<svg viewBox="0 0 200 140"><rect x="62" y="16" width="76" height="110" rx="4" fill="#d97706" stroke="#78350f" stroke-width="3"/><rect x="74" y="28" width="52" height="36" rx="2" fill="#f59e0b" stroke="#78350f" stroke-width="2"/><circle cx="126" cy="76" r="5" fill="#fef08a" stroke="#78350f" stroke-width="2"/></svg>`,
            "window": `<svg viewBox="0 0 200 140"><rect x="48" y="22" width="104" height="96" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="4"/><line x1="100" y1="22" x2="100" y2="118" stroke="#0369a1" stroke-width="4"/><line x1="48" y1="70" x2="152" y2="70" stroke="#0369a1" stroke-width="4"/></svg>`,
            "table": `<svg viewBox="0 0 200 140"><rect x="28" y="42" width="144" height="16" rx="4" fill="#a16207" stroke="#451a03" stroke-width="3"/><rect x="44" y="58" width="12" height="58" fill="#78350f"/><rect x="144" y="58" width="12" height="58" fill="#78350f"/></svg>`,

    }

    function otomatikAcilisiDurdur() {
        if (parcaZamanlayici) {
            clearInterval(parcaZamanlayici);
            parcaZamanlayici = null;
        }
    }

    function parcalariSifirlaVeOtomatikAc() {
        otomatikAcilisiDurdur();
        acikParcaSayisi = 0;

        const endeksler = [];
        for (let i = 0; i < TOPLAM_PARCA; i++) {
            const kapak = document.getElementById("parca-" + i);
            if (kapak) kapak.classList.remove("acik");
            endeksler.push(i);
        }

        kalanKapaliParcalar = diziyiKaristir(endeksler);
        guncelleParcaMetni();

        parcaZamanlayici = setInterval(() => {
            if (soruTamamlandi || kalanKapaliParcalar.length === 0) {
                otomatikAcilisiDurdur();
                return;
            }
            const siradakiKapakNo = kalanKapaliParcalar.pop();
            const kapak = document.getElementById("parca-" + siradakiKapakNo);
            if (kapak && !kapak.classList.contains("acik")) {
                kapak.classList.add("acik");
                acikParcaSayisi++;
                guncelleParcaMetni();
            }
            if (kalanKapaliParcalar.length === 0) {
                otomatikAcilisiDurdur();
            }
        }, PARCA_SURESI_MS);
    }

    function guncelleParcaMetni() {
        const ipucu = document.getElementById("ipucuAlani");
        ipucu.innerText = `Parçalar: ${acikParcaSayisi} / ${TOPLAM_PARCA} açıldı`;
    }

    function tumParcalariAc() {
        otomatikAcilisiDurdur();
        kalanKapaliParcalar = [];
        for (let i = 0; i < TOPLAM_PARCA; i++) {
            const kapak = document.getElementById("parca-" + i);
            if (kapak) kapak.classList.add("acik");
        }
        acikParcaSayisi = TOPLAM_PARCA;
        guncelleParcaMetni();
    }

    function secenekleriOlustur(dogruKelime) {
        const alan = document.getElementById("seceneklerAlani");
        alan.innerHTML = "";

        const digerKelimeler = kelimeListesi.filter(k => k !== dogruKelime);
        const karisikDiger = diziyiKaristir(digerKelimeler).slice(0, 2);
        const ucSecenek = diziyiKaristir([dogruKelime, ...karisikDiger]);

        ucSecenek.forEach(kelime => {
            const btn = document.createElement("button");
            btn.className = "secenek-btn";
            btn.innerText = kelime;
            btn.onclick = () => secenekSecildi(btn, kelime, dogruKelime);
            alan.appendChild(btn);
        });
    }

    function soruyuHazirla(sesiCal = false) {
        const mesaj = document.getElementById("mesajAlani");
        mesaj.innerText = "";
        denemeSayisi = 0;
        soruTamamlandi = false;

        document.getElementById("soruNo").innerText = mevcutIndex + 1;
        document.getElementById("sonrakiBtn").style.display = "none";

        const aktifKelime = kelimeListesi[mevcutIndex];
        resmiYukleVeyaSvgCiz(aktifKelime);
        secenekleriOlustur(aktifKelime);
        parcalariSifirlaVeOtomatikAc();

        if (sesiCal) {
            whatIsThisSesiniCal();
        }
    }

    function kelimeyiDinle() {
        sesBaglaminiHazirla();
        const kelime = kelimeListesi[mevcutIndex];
        const dosyaAdi = encodeURIComponent(kelime);
        sesAdaylariniSiraylaCal([`sesler/${dosyaAdi}.mp3`], kelime);
    }

    function tarayiciSesiyleOku(kelime) {
        if (!("speechSynthesis" in window)) return;
        tarayiciSesleriniYukle();
        window.speechSynthesis.resume();

        const metin = new SpeechSynthesisUtterance(kelime);
        metin.lang = 'en-US';
        metin.rate = 0.85;

        const ingilizceSes = hazirSesler.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
        if (ingilizceSes) {
            metin.voice = ingilizceSes;
        }

        setTimeout(() => {
            window.speechSynthesis.speak(metin);
        }, 50);
    }

    async function neseliDingCal(dogruMu) {
        try {
            const ctx = sesBaglaminiHazirla();
            if (!ctx) return;
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            const simdi = ctx.currentTime;
            if (dogruMu) {
                const notalar = [659.25, 783.99, 1046.50];
                notalar.forEach((frekans, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frekans, simdi + i * 0.11);
                    gain.gain.setValueAtTime(0.001, simdi + i * 0.11);
                    gain.gain.exponentialRampToValueAtTime(0.35, simdi + i * 0.11 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, simdi + i * 0.11 + 0.55);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(simdi + i * 0.11);
                    osc.stop(simdi + i * 0.11 + 0.6);
                });
            } else {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, simdi);
                osc.frequency.exponentialRampToValueAtTime(195, simdi + 0.18);
                gain.gain.setValueAtTime(0.001, simdi);
                gain.gain.linearRampToValueAtTime(0.11, simdi + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, simdi + 0.22);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(simdi);
                osc.stop(simdi + 0.23);
            }
        } catch (e) {}
    }

    function secenekSecildi(buton, secilenKelime, dogruKelime) {
        if (soruTamamlandi) return;
        sesBaglaminiHazirla();

        denemeSayisi++;
        const mesaj = document.getElementById("mesajAlani");

        if (secilenKelime === dogruKelime) {
            soruTamamlandi = true;
            tumParcalariAc();
            neseliDingCal(true);

            const kazanilanPuan = denemeSayisi === 1 ? 10 : 5;
            puan += kazanilanPuan;
            document.getElementById("puan").innerText = puan;

            buton.classList.add("dogru-secenek");
            Array.from(document.getElementById("seceneklerAlani").children).forEach(b => {
                b.disabled = true;
            });

            mesaj.style.color = "#16a34a";
            mesaj.innerText = `Harika! Doğru bildin (+${kazanilanPuan} puan).`;
            document.getElementById("sonrakiBtn").style.display = "inline-block";
            kelimeyiDinle();
        } else {
            neseliDingCal(false);
            buton.classList.add("yanlis-secenek");
            buton.disabled = true;
            mesaj.style.color = "#64748b";
            mesaj.innerText = "Tekrar dene! Parçalar açılmaya devam ediyor.";
        }
    }

    function sonrakiSoru() {
        sesBaglaminiHazirla();
        mevcutIndex++;
        if (mevcutIndex < kelimeListesi.length) soruyuHazirla(true);
        else oyunuBitir();
    }

    async function oyunuBitir() {
        otomatikAcilisiDurdur();
        sureSayaciniDurdur();

        document.getElementById("oyunEkrani").classList.add("gizli");
        document.getElementById("sonucEkrani").classList.remove("gizli");

        const maksimumPuan = kelimeListesi.length * 10;
        const basariYuzdesi = (puan / maksimumPuan) * 100;
        const toplamSureYazi = sureyiBicimlendir(gecenSaniye);

        let yildizSayisi = 1;
        let yildizMesaji = "Güzel çaba! Biraz daha pratikle harika olacaksın.";
        if (basariYuzdesi >= 80) { yildizSayisi = 3; yildizMesaji = "Mükemmel! Tam bir yıldız öğrencisin!"; }
        else if (basariYuzdesi >= 50) { yildizSayisi = 2; yildizMesaji = "Çok iyi iş çıkardın!"; }

        document.getElementById("yildizAlani").innerText = "⭐".repeat(yildizSayisi) + "☆".repeat(3 - yildizSayisi);
        document.getElementById("sonucMetni").innerHTML = `
            <strong>${ogrenciAdi}</strong> (${ogrenciSinifi})<br>
            ${yildizMesaji}<br>
            Toplam Puanın: <strong>${puan} / ${maksimumPuan}</strong><br>
            Süre: <strong>${toplamSureYazi}</strong>
        `;

        await googleTabloyaKaydet(maksimumPuan, yildizSayisi, toplamSureYazi);
    }

    async function googleTabloyaKaydet(maksimumPuan, yildizSayisi, toplamSureYazi) {
        const simdi = new Date();
        const tarihSaat = simdi.toLocaleDateString('tr-TR') + " " +
                          simdi.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        const durumKutusu = document.getElementById("kayitDurumu");

        const veriPaketi = {
            oyun_adi: OYUNUN_ADI,
            ogrenci_adi: ogrenciAdi,
            sinifi: ogrenciSinifi,
            puan: `${puan} / ${maksimumPuan}`,
            sure: toplamSureYazi,
            puan_sure: `${puan} / ${maksimumPuan} / ${toplamSureYazi}`,
            yildiz: `${yildizSayisi} Yıldız`,
            tarih_saat: tarihSaat
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(veriPaketi)
            });
            durumKutusu.innerHTML = `✅ Tebrikler! Sonucun öğretmeninin listesine başarıyla kaydedildi.`;
        } catch (err) {
            durumKutusu.style.background = "#fef3c7";
            durumKutusu.style.color = "#92400e";
            durumKutusu.innerHTML = `ℹ️ Oyun tamamlandı (Çevrimdışı mod).`;
        }
    }
</script>
