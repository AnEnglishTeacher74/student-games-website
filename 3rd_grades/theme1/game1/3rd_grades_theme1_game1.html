<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Pop - Numbers, Greetings & School</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 12px;
        }
        
        .kart {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { color: #1e293b; margin-top: 0; }
        
        .input-grup { margin-bottom: 15px; text-align: left; max-width: 420px; margin-left: auto; margin-right: auto; }
        .input-grup label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .input-grup input {
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 16px;
        }
        .input-grup input:focus { border-color: #3b82f6; outline: none; }

        .btn {
            padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; margin: 5px;
        }
        .btn-basla { background-color: #2563eb; color: white; width: 100%; max-width: 420px; margin-top: 10px; }
        .btn-basla:hover { background-color: #1d4ed8; }
        .btn-anasayfa { background-color: #64748b; color: white; width: 100%; max-width: 420px; margin-top: 8px; }
        .btn-anasayfa:hover { background-color: #475569; }
        .btn-dinle {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white; font-size: 18px; padding: 12px 28px; border-radius: 30px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn-dinle:hover { transform: scale(1.04); }

        .ust-bilgi {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
            font-size: 14px; color: #475569; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;
        }
        .sure-kutusu {
            background-color: #eff6ff; color: #1d4ed8; font-weight: bold; padding: 5px 10px; border-radius: 8px; border: 1px solid #bfdbfe;
        }
        .cikis-link {
            color: #64748b; text-decoration: none; font-weight: 600; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #f1f5f9;
        }

        .gokyuzu-alani {
            position: relative;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 65%, #dcfce7 100%);
            border-radius: 16px;
            padding: 25px 12px 35px 12px;
            margin: 18px 0;
            border: 2px solid #7dd3fc;
            min-height: 290px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            overflow: hidden;
        }

        .balon-kapsayici {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            animation: suzulme 2.8s ease-in-out infinite alternate;
            transition: transform 0.25s ease, opacity 0.35s ease;
        }
        .balon-kapsayici:nth-child(2) { animation-delay: 0.5s; }
        .balon-kapsayici:nth-child(3) { animation-delay: 1.0s; }
        .balon-kapsayici:nth-child(4) { animation-delay: 1.5s; }

        @keyframes suzulme {
            0% { transform: translateY(-7px); }
            100% { transform: translateY(9px); }
        }

        .balon {
            width: 125px;
            height: 142px;
            border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
            font-weight: 800;
            font-size: 17px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.25);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.18), inset 8px 8px 16px rgba(255,255,255,0.4), 0 8px 16px rgba(0,0,0,0.12);
            position: relative;
            transition: transform 0.2s, background 0.3s;
            line-height: 1.2;
        }

        .balon:hover {
            transform: scale(1.06);
        }

        .balon::after {
            content: "";
            position: absolute;
            bottom: -9px;
            width: 14px;
            height: 10px;
            background: inherit;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .balon-ip {
            width: 2px;
            height: 36px;
            background-color: #64748b;
            margin-top: 6px;
        }

        .anlam-etiketi {
            margin-top: 6px;
            background-color: #ffffff;
            color: #15803d;
            border: 2px solid #22c55e;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            animation: anlamBelir 0.25s ease;
        }

        @keyframes anlamBelir {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .balon-renk-0 { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); }
        .balon-renk-1 { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }
        .balon-renk-2 { background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706); }
        .balon-renk-3 { background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed); }

        .balon-dogru-bekle .balon {
            background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a) !important;
            transform: scale(1.1);
            box-shadow: 0 0 22px rgba(34, 197, 94, 0.7);
        }

        .balon-patla {
            animation: patlamaEfekti 0.38s ease forwards !important;
            pointer-events: none;
        }

        @keyframes patlamaEfekti {
            0% { transform: scale(1.1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }

        .balon-yanlis {
            animation: sarsinti 0.4s ease !important;
        }

        @keyframes sarsinti {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-6px); }
        }

        @media (max-width: 550px) {
            .balon { width: 105px; height: 120px; font-size: 14px; }
            .anlam-etiketi { font-size: 13px; padding: 2px 8px; }
        }

        .mesaj { font-weight: bold; font-size: 17px; min-height: 26px; margin-top: 8px; }

        .yildiz-kutusu { font-size: 52px; margin: 15px 0; letter-spacing: 8px; animation: popIn 0.5s ease; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .kayit-bilgi { font-size: 13px; color: #15803d; background: #dcfce7; padding: 10px; border-radius: 8px; margin: 15px auto; max-width: 420px; border: 1px solid #86efac; }
        .gizli { display: none; }
    </style>
</head>
<body>

<div class="kart">
    <div id="girisEkrani">
        <h2>🎈 Balloon Pop!</h2>
        <p style="color: #64748b;">Dinle ve doğru kelimenin balonunu patlat!</p>
        <div class="input-grup">
            <label for="ogrenciAd">Adın ve Soyadın:</label>
            <input type="text" id="ogrenciAd" placeholder="Örn: Zeynep Kaya" onkeydown="enterKontrol(event)">
        </div>
        <div class="input-grup">
            <label for="ogrenciSinif">Sınıfın:</label>
            <input type="text" id="ogrenciSinif" placeholder="Örn: 3-A" onkeydown="enterKontrol(event)">
        </div>
        <button class="btn btn-basla" onclick="oyunuBaslat()">Başla ▶</button>
        <br>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://anenglishteacher74.github.io/student-games-website/'">🏠 Ana Sayfaya Dön</button>
    </div>

    <div id="oyunEkrani" class="gizli">
        <div class="ust-bilgi">
            <span id="oyuncuBilgi">Öğrenci: -</span>
            <span>Soru: <strong id="soruNo">1</strong> / <strong id="toplamSoru">12</strong></span>
            <span>Puan: <strong id="puan">0</strong></span>
            <span class="sure-kutusu">⏱️ <span id="sureGosterge">0 sn</span></span>
            <a href="https://anenglishteacher74.github.io/student-games-website/" class="cikis-link">🏠 Ana Sayfa</a>
        </div>

        <button class="btn btn-dinle" onclick="hedefiDinle()">🔊 Listen / Dinle</button>

        <div id="gokyuzuAlani" class="gokyuzu-alani"></div>

        <div id="mesajAlani" class="mesaj"></div>
    </div>

    <div id="sonucEkrani" class="gizli">
        <h2>🎉 Tebrikler!</h2>
        <div id="yildizAlani" class="yildiz-kutusu"></div>
        <p id="sonucMetni" style="font-size: 18px; line-height: 1.6; color: #334155;"></p>
        <div id="kayitDurumu" class="kayit-bilgi">Sonucun öğretmenine gönderiliyor...</div>
        <button class="btn btn-basla" onclick="location.reload()">Tekrar Oyna ↻</button>
        <br>
        <button class="btn btn-anasayfa" onclick="window.location.href='https://anenglishteacher74.github.io/student-games-website/'">🏠 Ana Sayfaya Dön</button>
    </div>
</div>

<script>
    const OYUNUN_ADI = "Balloon Pop - Numbers & School (3. Sınıf)";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzH1gudYaYuoip_UYOTXQJVUwyXjhoOMm5SlYlvxyzmLz7xg3bp1A3PkX9nNJLlSk4/exec";

    const kelimeHavuzu = [
        { kelime: "eleven", anlam: "11", dosya: "eleven" },
        { kelime: "twelve", anlam: "12", dosya: "twelve" },
        { kelime: "fifteen", anlam: "15", dosya: "fifteen" },
        { kelime: "seventeen", anlam: "17", dosya: "seventeen" },
        { kelime: "twenty", anlam: "20", dosya: "twenty" },
        { kelime: "Hello!", anlam: "Merhaba!", dosya: "hello" },
        { kelime: "Good morning!", anlam: "Günaydın!", dosya: "good_morning" },
        { kelime: "Goodbye!", anlam: "Hoşça kal!", dosya: "goodbye" },
        { kelime: "school", anlam: "okul", dosya: "school" },
        { kelime: "student", anlam: "öğrenci", dosya: "student" },
        { kelime: "teacher", anlam: "öğretmen", dosya: "teacher" },
        { kelime: "book", anlam: "kitap", dosya: "book" }
    ];

    let sorular = [];
    let mevcutIndex = 0;
    let puan = 0;
    let hataliDeneme = 0;
    let gecenSaniye = 0;
    let zamanlayici = null;
    let kilitli = false;
    let ogrenciAdi = "";
    let ogrenciSinifi = "";
    let aktifSes = null;
    let sesBaglami = null;
    let hazirSesler = [];

    function sesBaglaminiHazirla() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!sesBaglami) {
            sesBaglami = new AudioCtx();
        }
        if (sesBaglami.state === "suspended") {
            sesBaglami.resume().catch(() => {});
        }
        return sesBaglami;
    }

    function tarayiciSesleriniYukle() {
        if (!("speechSynthesis" in window)) return;
        hazirSesler = window.speechSynthesis.getVoices() || [];
    }

    if ("speechSynthesis" in window) {
        tarayiciSesleriniYukle();
        window.speechSynthesis.onvoiceschanged = tarayiciSesleriniYukle;
    }

    function enterKontrol(e) { if (e.key === "Enter") oyunuBaslat(); }

    function diziyiKaristir(dizi) {
        const kopya = [...dizi];
        for (let i = kopya.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [kopya[i], kopya[j]] = [kopya[j], kopya[i]];
        }
        return kopya;
    }

    function sureFormatla(toplamSaniye) {
        if (toplamSaniye < 60) return `${toplamSaniye} sn`;
        const dakika = Math.floor(toplamSaniye / 60);
        const saniye = toplamSaniye % 60;
        return `${dakika} dk ${saniye < 10 ? '0' : ''}${saniye} sn`;
    }

    function oyunuBaslat() {
        ogrenciAdi = document.getElementById("ogrenciAd").value.trim();
        ogrenciSinifi = document.getElementById("ogrenciSinif").value.trim();
        if (!ogrenciAdi || !ogrenciSinifi) { alert("Lütfen adını ve sınıfını yaz!"); return; }

        sesBaglaminiHazirla();
        tarayiciSesleriniYukle();

        sorular = diziyiKaristir(kelimeHavuzu);
        document.getElementById("girisEkrani").classList.add("gizli");
        document.getElementById("oyunEkrani").classList.remove("gizli");
        document.getElementById("oyuncuBilgi").innerText = `${ogrenciAdi} (${ogrenciSinifi})`;
        document.getElementById("toplamSoru").innerText = sorular.length;

        sayaciBaslat();
        soruyuHazirla(true);
    }

    function sayaciBaslat() {
        gecenSaniye = 0;
        document.getElementById("sureGosterge").innerText = "0 sn";
        zamanlayici = setInterval(() => {
            gecenSaniye++;
            document.getElementById("sureGosterge").innerText = sureFormatla(gecenSaniye);
        }, 1000);
    }

    function soruyuHazirla(ilkSoruMu = false) {
        kilitli = false;
        hataliDeneme = 0;
        const gokyuzu = document.getElementById("gokyuzuAlani");
        const mesaj = document.getElementById("mesajAlani");
        gokyuzu.innerHTML = "";
        mesaj.innerText = "";

        document.getElementById("soruNo").innerText = mevcutIndex + 1;

        const hedef = sorular[mevcutIndex];
        const yanlislar = diziyiKaristir(kelimeHavuzu.filter(item => item.kelime !== hedef.kelime)).slice(0, 3);
        const secenekler = diziyiKaristir([hedef, ...yanlislar]);
        const renkIndeksleri = diziyiKaristir([0, 1, 2, 3]);

        secenekler.forEach((secenek, i) => {
            const kapsayici = document.createElement("div");
            kapsayici.className = "balon-kapsayici";

            const balon = document.createElement("div");
            balon.className = `balon balon-renk-${renkIndeksleri[i]}`;
            balon.innerHTML = `<span>${secenek.kelime}</span>`;

            const ip = document.createElement("div");
            ip.className = "balon-ip";

            kapsayici.appendChild(balon);
            kapsayici.appendChild(ip);

            kapsayici.onclick = () => balonaTiklandi(kapsayici, balon, secenek, hedef);
            gokyuzu.appendChild(kapsayici);
        });

        // İlk soruda "Başla" dokunuşundan hemen sonra çal;
        // sonraki sorularda iOS ses kilidine takılmamak için "Listen / Dinle" butonuna bırak
        if (ilkSoruMu) {
            setTimeout(() => hedefiDinle(), 250);
        }
    }

    function balonaTiklandi(kapsayici, balon, secenek, hedef) {
        if (kilitli) return;

        sesBaglaminiHazirla();

        if (secenek.kelime === hedef.kelime) {
            kilitli = true;
            sesEfektiCal(true);

            kapsayici.classList.add("balon-dogru-bekle");
            const anlamEtiketi = document.createElement("div");
            anlamEtiketi.className = "anlam-etiketi";
            anlamEtiketi.innerText = `= ${hedef.anlam}`;
            balon.appendChild(anlamEtiketi);

            const kazanilan = hataliDeneme === 0 ? 10 : 5;
            puan += kazanilan;
            document.getElementById("puan").innerText = puan;

            const mesaj = document.getElementById("mesajAlani");
            mesaj.style.color = "#16a34a";
            mesaj.innerText = `🎈 Harika! "${hedef.kelime}" (${hedef.anlam}) +${kazanilan} puan!`;

            setTimeout(() => {
                kapsayici.classList.add("balon-patla");
                patlamaSesiCal();
            }, 950);

            setTimeout(() => {
                mevcutIndex++;
                if (mevcutIndex < sorular.length) soruyuHazirla(false);
                else oyunuBitir();
            }, 1450);
        } else {
            hataliDeneme++;
            sesEfektiCal(false);
            kapsayici.classList.remove("balon-yanlis");
            void kapsayici.offsetWidth;
            kapsayici.classList.add("balon-yanlis");

            const mesaj = document.getElementById("mesajAlani");
            mesaj.style.color = "#dc2626";
            mesaj.innerText = "Tekrar dinle ve doğru balonu seç!";
        }
    }

    function hedefiDinle() {
        const hedef = sorular[mevcutIndex];
        if (!hedef) return;

        sesBaglaminiHazirla();

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
        }
        if (aktifSes) {
            aktifSes.onended = null;
            aktifSes.onerror = null;
            aktifSes.pause();
            aktifSes.currentTime = 0;
        }

        let yedekCalindi = false;
        const tarayiciOku = () => {
            if (yedekCalindi) return;
            yedekCalindi = true;
            tarayiciSesiyleOku(hedef.kelime);
        };

        const sesDosyasi = new Audio(`sesler/${hedef.dosya}.mp3`);
        sesDosyasi.playsInline = true;
        aktifSes = sesDosyasi;

        sesDosyasi.onerror = tarayiciOku;
        const oynatPromise = sesDosyasi.play();
        if (oynatPromise && typeof oynatPromise.catch === "function") {
            oynatPromise.catch(tarayiciOku);
        }
    }

    function tarayiciSesiyleOku(kelime) {
        if (!("speechSynthesis" in window)) return;
        tarayiciSesleriniYukle();
        window.speechSynthesis.resume();

        const metin = new SpeechSynthesisUtterance(kelime);
        metin.lang = 'en-US';
        metin.rate = 0.85;

        const ingilizceSes = hazirSesler.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
        if (ingilizceSes) {
            metin.voice = ingilizceSes;
        }

        setTimeout(() => {
            window.speechSynthesis.speak(metin);
        }, 50);
    }

    async function sesEfektiCal(dogruMu) {
        try {
            const ctx = sesBaglaminiHazirla();
            if (!ctx) return;
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            const simdi = ctx.currentTime;
            if (dogruMu) {
                const notalar = [659.25, 783.99, 1046.50];
                notalar.forEach((frekans, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frekans, simdi + i * 0.09);
                    gain.gain.setValueAtTime(0.001, simdi + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.3, simdi + i * 0.09 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, simdi + i * 0.09 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(simdi + i * 0.09);
                    osc.stop(simdi + i * 0.09 + 0.45);
                });
            } else {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, simdi);
                osc.frequency.linearRampToValueAtTime(150, simdi + 0.22);
                gain.gain.setValueAtTime(0.22, simdi);
                gain.gain.exponentialRampToValueAtTime(0.001, simdi + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(simdi);
                osc.stop(simdi + 0.25);
            }
        } catch (e) {}
    }

    async function patlamaSesiCal() {
        try {
            const ctx = sesBaglaminiHazirla();
            if (!ctx) return;
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            const simdi = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, simdi);
            osc.frequency.exponentialRampToValueAtTime(60, simdi + 0.14);
            gain.gain.setValueAtTime(0.35, simdi);
            gain.gain.exponentialRampToValueAtTime(0.001, simdi + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(simdi);
            osc.stop(simdi + 0.16);
        } catch (e) {}
    }

    async function oyunuBitir() {
        clearInterval(zamanlayici);
        document.getElementById("oyunEkrani").classList.add("gizli");
        document.getElementById("sonucEkrani").classList.remove("gizli");

        const bitisSuresiMetni = sureFormatla(gecenSaniye);
        const maksimumPuan = sorular.length * 10;
        const yuzde = (puan / maksimumPuan) * 100;

        let yildizSayisi = 1;
        let yildizMesaji = "Güzel çaba! Biraz daha pratikle tüm balonları ilk seferde patlatabilirsin.";
        if (yuzde >= 80) { yildizSayisi = 3; yildizMesaji = "Mükemmel! Tam bir yıldız öğrencisin!"; }
        else if (yuzde >= 50) { yildizSayisi = 2; yildizMesaji = "Çok iyi iş çıkardın!"; }

        document.getElementById("yildizAlani").innerText = "⭐".repeat(yildizSayisi) + "☆".repeat(3 - yildizSayisi);
        document.getElementById("sonucMetni").innerHTML = `
            <strong>${ogrenciAdi}</strong> (${ogrenciSinifi})<br>
            ${yildizMesaji}<br>
            Süre: <strong>${bitisSuresiMetni}</strong> | Puan: <strong>${puan} / ${maksimumPuan}</strong>
        `;

        await googleTabloyaKaydet(maksimumPuan, bitisSuresiMetni, yildizSayisi);
    }

    async function googleTabloyaKaydet(maksimumPuan, sureMetni, yildizSayisi) {
        const simdi = new Date();
        const tarihSaat = simdi.toLocaleDateString('tr-TR') + " " + 
                          simdi.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        const durumKutusu = document.getElementById("kayitDurumu");

        const veriPaketi = {
            oyun_adi: OYUNUN_ADI,
            ogrenci_adi: ogrenciAdi,
            sinifi: ogrenciSinifi,
            puan: `${puan}/${maksimumPuan} (${sureMetni})`,
            yildiz: `${yildizSayisi} Yıldız`,
            tarih_saat: tarihSaat
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(veriPaketi)
            });
            durumKutusu.innerHTML = `✅ Tebrikler! Sonucun öğretmeninin listesine başarıyla kaydedildi.`;
        } catch (err) {
            durumKutusu.style.background = "#fef3c7";
            durumKutusu.style.color = "#92400e";
            durumKutusu.innerHTML = `ℹ️ Oyun tamamlandı (Çevrimdışı mod).`;
        }
    }
</script>

</body>
</html>
